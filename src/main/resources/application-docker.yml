spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-order:5432/orderdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8082/.well-known/jwks.json

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8081}