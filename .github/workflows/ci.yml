name: CI

on:
  push:
    branches: [ "main", "feature/**"]
  pull_request:
    branches: [ "main"]

jobs:
  build-test-analyze-package:
    name: Build, Test, Analyze, Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B clean compile

      - name: Test
        run: mvn -B test

      - name: Build Docker image
        run: docker build -t order-service:${{ github.sha }} .

      - name: Save Docker image
        run: docker save order-service:${{ github.sha }} -o order-service.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-service-docker-image
          path: order-service.tar
          retention-days: 7